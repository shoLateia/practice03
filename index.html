<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>js課題</title>
        <style>
            ul {
                list-style: none;
                padding: 0;
            }

            li {
                margin-bottom: 10px;
            }

            a {
                text-decoration: none;
                color: #333;
                display: inline-block;
                padding: 8px 16px;
                border: 1px solid #ccc;
                border-radius: 4px;
                transition: background-color 0.3s;
            }

            a:hover {
                background-color: #f0f0f0;
            }
        </style>
    </head>
    <body>
        <ul>
            <li><a href="./tabmenu/" target="_blank" rel="noopener noreferrer">タブメニュー</a></li>
            <li><a href="./accordion/" target="_blank" rel="noopener noreferrer">アコーディオン</a></li>
            <li><a href="./smoothscroll/" target="_blank" rel="noopener noreferrer">スムーススクロール</a></li>
            <li><a href="./intersectionObserver/" target="_blank" rel="noopener noreferrer">IntersectionObserver</a></li>
        </ul>
    </body>
</html>
